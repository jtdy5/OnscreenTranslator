workflows:
  unsigned-ios-ipa:
    name: Unsigned iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Show Xcode version
        script: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Archive app without code signing
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild \
            -project OnscreenTranslator.xcodeproj \
            -scheme OnscreenTranslator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/OnscreenTranslator.xcarchive" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
      - name: Package and validate unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/build/OnscreenTranslator.xcarchive/Products/Applications/OnscreenTranslator.app"
          IPA_DIR="$CM_BUILD_DIR/build/ipa"
          IPA_PATH="$IPA_DIR/OnscreenTranslator-unsigned.ipa"

          test -d "$APP_PATH"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/OnscreenTranslator.app"
          (cd "$IPA_DIR" && /usr/bin/zip -qry "$IPA_PATH" Payload)
          /usr/bin/unzip -t "$IPA_PATH"
    artifacts:
      - build/ipa/OnscreenTranslator-unsigned.ipa

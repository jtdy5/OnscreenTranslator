name: Build Unsigned IPA

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build and Archive (Unsigned)
        env:
          # Update these two variables if the repo uses a different name or an .xcworkspace
          PROJECT_NAME: OnscreenTranslator.xcodeproj
          SCHEME_NAME: OnscreenTranslator
        run: |
          xcodebuild clean archive \
            -project "$PROJECT_NAME" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Archive into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r OnscreenTranslator.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnscreenTranslator-IPA
          path: build/OnscreenTranslator.ipa

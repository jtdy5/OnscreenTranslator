name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          xcodebuild archive \
            -project OnscreenTranslator.xcodeproj \
            -scheme OnscreenTranslator \
            -configuration Release \
            -archivePath $RUNNER_TEMP/OnscreenTranslator.xcarchive \
            -sdk iphoneos \
            GEMINI_API_KEY="$GEMINI_API_KEY" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/OnscreenTranslator.xcarchive/Products/Applications/OnscreenTranslator.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r OnscreenTranslator.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnscreenTranslator-unsigned-ipa
          path: ${{ runner.temp }}/OnscreenTranslator.ipa
